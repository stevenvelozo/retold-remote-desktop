name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build web assets once on Linux (quack/gulp has path issues on Windows)
  web-assets:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone retold-remote
        uses: actions/checkout@v4
        with:
          repository: stevenvelozo/retold-remote
          path: _retold-remote

      - name: Build retold-remote web assets
        working-directory: _retold-remote
        run: |
          npm install
          npx quack build

      - name: Copy web assets
        run: |
          mkdir -p web-app/js web-app/css web-app/docs
          cp _retold-remote/web-application/retold-remote.js web-app/ || true
          cp _retold-remote/web-application/retold-remote.min.js web-app/ || true
          cp _retold-remote/web-application/retold-remote.js.map web-app/ 2>/dev/null || true
          cp _retold-remote/web-application/retold-remote.min.js.map web-app/ 2>/dev/null || true
          cp _retold-remote/web-application/codejar.js web-app/ || true
          cp _retold-remote/web-application/js/* web-app/js/ || true
          cp _retold-remote/web-application/css/* web-app/css/ || true
          cp _retold-remote/web-application/docs/* web-app/docs/ 2>/dev/null || true
          cp _retold-remote/web-application/docs.html web-app/ 2>/dev/null || true

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web-app/

  build:
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin -c '{\"app\":{\"windows\":[{\"label\":\"main\",\"transparent\":true}]}}'"
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: '--bundles msi'
            rust-targets: ''
          - platform: ubuntu-22.04
            args: '--bundles deb appimage'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web-app/

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.AppImage
          if-no-files-found: warn
